server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json font/ttf font/otf image/svg+xml;
    gzip_min_length 1024;

    # Berkas yang menentukan versi build (index, bootstrap, main.dart.js,
    # version.json) tidak boleh di-cache: Flutter memuat main.dart.js tanpa
    # query versi, jadi cache lama akan menahan rilis baru berhari-hari.
    location / {
        expires -1;
        add_header Cache-Control "no-store";
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|json|css|wasm)$ {
        expires -1;
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # Font & gambar jarang berubah: cache lama.
    location ~* \.(ttf|otf|woff2?|png|jpg|jpeg|svg|ico|mp4)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
