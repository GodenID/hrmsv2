server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json font/ttf font/otf image/svg+xml;
    gzip_min_length 1024;

    # Aset berversi (main.dart.js, font, ikon): cache lama.
    location ~* \.(js|css|ttf|otf|woff2?|png|jpg|jpeg|svg|ico|json)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html & SPA fallback: tanpa cache (rilis baru langsung tampil).
    location / {
        expires -1;
        add_header Cache-Control "no-store";
        try_files $uri $uri/ /index.html;
    }
}
